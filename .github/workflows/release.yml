name: Release

# Al fusionar release/X.Y.Z o hotfix/X.Y.Z en main:
#   1. crea el tag vX.Y.Z y la GitHub Release con notas automáticas
# No crea ramas de desarrollo ni despliega servicios.
on:
  pull_request:
    branches: [main]
    types: [closed]

permissions:
  contents: write

jobs:
  release:
    if: >-
      github.event.pull_request.merged == true &&
      (startsWith(github.head_ref, 'release/') || startsWith(github.head_ref, 'hotfix/'))
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
      HEAD_REF: ${{ github.head_ref }}
      MERGE_SHA: ${{ github.event.pull_request.merge_commit_sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Crear tag y release
        run: |
          VERSION="v${HEAD_REF#*/}"
          gh release create "$VERSION" --target "$MERGE_SHA" --title "$VERSION" --generate-notes

