name: CI

on:
  push:
    branches: [main, develop, "feature/**", "bugfix/**", "release/**", "hotfix/**"]
  pull_request:
    branches: [main, develop]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  agent:
    name: Agente Python (ruff + pytest)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-starter-python
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.12"
          enable-cache: true

      - name: Instalar dependencias (uv.lock)
        run: uv sync --locked

      - name: Lint
        run: uv run ruff check --output-format=github .

      - name: Formato
        run: uv run ruff format --check --diff .

      - name: Tests
        run: uv run pytest -v

  frontend:
    name: Frontend (build Next.js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: agent-starter-react
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: agent-starter-react/package-lock.json

      - name: Instalar dependencias
        run: npm ci --legacy-peer-deps

      - name: Build
        run: npm run build

  docker:
    name: Docker Compose (config + imágenes)
    runs-on: ubuntu-latest
    needs: [agent, frontend]
    steps:
      - uses: actions/checkout@v4

      - name: Validar docker-compose.yml
        run: |
          cp .env.example .env
          docker compose config --quiet

      # whisper-stt no se construye aquí: su imagen con PyTorch+CUDA supera el disco de los runners.
      - name: Construir imágenes del agente y del frontend
        run: docker compose build voice-agent frontend
