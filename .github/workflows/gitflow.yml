name: Gitflow

on:
  pull_request:
    branches: [main, backp-fase1]
    types: [opened, reopened, synchronize, edited]

permissions:
  contents: read

jobs:
  branch-policy:
    name: Política de ramas
    runs-on: ubuntu-latest
    steps:
      - name: Verificar rama origen
        env:
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: |
          case "$BASE_REF" in
            main) allowed='^((feature|bugfix|chore)/[a-z0-9._-]+|(release|hotfix)/[0-9]+\.[0-9]+\.[0-9]+)$' ;;
            backp-fase1) allowed='^main$' ;;
            *) echo "::error::Base de trabajo no admitida: $BASE_REF"; exit 1 ;;
          esac

          if printf '%s' "$HEAD_REF" | grep -Eq "$allowed"; then
            echo "✓ '$HEAD_REF' -> '$BASE_REF' cumple el flujo basado en main."
          else
            echo "::error::'$HEAD_REF' no puede fusionarse en '$BASE_REF'."
            echo "main <- feature/nombre | bugfix/nombre | chore/nombre | release/X.Y.Z | hotfix/X.Y.Z"
            echo "backp-fase1 <- main (referencia de compatibilidad, no desarrollo paralelo)"
            exit 1
          fi
