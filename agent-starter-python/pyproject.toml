[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agent-starter-python"
version = "1.0.0"
description = "Simple voice AI assistant built with LiveKit Agents for Python"
requires-python = ">=3.10, <3.15"

dependencies = [
    "llama-index-core>=0.11.0",
    "llama-index-embeddings-gemini",
    "llama-index-llms-gemini",
    "livekit-agents>=1.6.9",
    "livekit-plugins-ai-coustics~=0.2",
    "livekit-plugins-google>=1.8.2",
    "livekit-plugins-openai>=1.8.0",
    "livekit-plugins-silero>=1.8.0",
    "mem0ai>=2.0.0",
    "python-dotenv",
    "pypdf>=5.0.0",
    "python-docx>=1.1.0",
    "llama-index-embeddings-google-genai>=0.6.0",
    "llama-index-llms-google-genai>=0.11.2",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-asyncio",
    "ruff",
]

[tool.uv]
# yarl 1.24.1 was published with only a cp310 wheel and no sdist, so it can't
# install on Python 3.11+. Remove this once upstream uploads the remaining wheels.
constraint-dependencies = ["yarl<1.24"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"

[tool.ruff]
line-length = 88
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "B", "A", "C4", "UP", "SIM", "RUF"]
ignore = ["E501"]  # Line too long (handled by formatter)

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
