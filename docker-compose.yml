services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./agent-starter-python/Modelfile:/Modelfile:ro
      - ollama_data:/root/.ollama
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        echo "Verificando disponibilidad de Ollama..."
        until ollama list > /dev/null 2>&1; do sleep 1; done
        # El modelo base se lee del Modelfile: cambiarlo ahí basta para que se actualice.
        BASE_MODEL=$$(tr -d '\r' < /Modelfile | awk '/^FROM/ {print $$2; exit}')
        MODELFILE_SHA=$$(tr -d '\r' < /Modelfile | sha256sum | cut -d' ' -f1)
        STAMP=/root/.ollama/nexus.modelfile.sha256
        if ollama list | grep -q '^nexus:' && [ "$$(cat "$$STAMP" 2>/dev/null)" = "$$MODELFILE_SHA" ]; then
          echo "Modelo nexus al día con el Modelfile (base $$BASE_MODEL)."
        else
          echo "Descargando modelo base $$BASE_MODEL..."
          ollama pull "$$BASE_MODEL"
          echo "Creando modelo personalizado nexus desde el Modelfile..."
          tr -d '\r' < /Modelfile > /tmp/Modelfile
          ollama create nexus -f /tmp/Modelfile
          echo "$$MODELFILE_SHA" > "$$STAMP"
          echo "Modelo nexus listo para su uso."
        fi
        echo "Precargando modelo nexus en memoria..."
        ollama run nexus "hola" > /dev/null 2>&1
        echo "Nexus activo en memoria y listo para llamadas."
    restart: "no"

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    ports:
      - "8880:8880"
    volumes:
      - kokoro_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  whisper-stt:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/models_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - WHISPER_BEAM_SIZE=${WHISPER_BEAM_SIZE:-1}
      - WHISPER_VAD_FILTER=${WHISPER_VAD_FILTER:-false}
      - DEVICE=cuda
      - COMPUTE_TYPE=float16
      - HF_HOME=/models_cache
    restart: unless-stopped

  knowledge-sync:
    build:
      context: ./knowledge-sync
      dockerfile: Dockerfile
    environment:
      - DATA_DIR=/data
      - SYNC_INTERVAL_HOURS=${SYNC_INTERVAL_HOURS:-24}
      - PORTAL_CONOCIMIENTO_URL=${PORTAL_CONOCIMIENTO_URL:-https://portalconocimiento.autonoma.edu.co}
      - PORTAL_CONOCIMIENTO_USER=${PORTAL_CONOCIMIENTO_USER:-}
      - PORTAL_CONOCIMIENTO_APP_PASSWORD=${PORTAL_CONOCIMIENTO_APP_PASSWORD:-}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
    volumes:
      - knowledge_data:/data
      - ./knowledge-sync/sync.py:/app/sync.py:ro
      - ./data/documentos_uam:/data/documentos_uam
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys; sys.exit(0 if os.path.isfile('/data/knowledge.db') else 1)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 30m
    restart: unless-stopped

  livekit:
    image: livekit/livekit-server:latest
    command: --dev --bind 0.0.0.0
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"
    restart: unless-stopped

  # Mem0 usaba Qdrant en modo local (un archivo en disco) — bug real
  # encontrado el 2026-10-08: ese modo toma un lock exclusivo del archivo,
  # asi que en cuanto hay una llamada real activa y LiveKit levanta un
  # segundo proceso worker (num_idle_processes=1 deja uno de repuesto
  # listo para la siguiente llamada), el segundo proceso no puede abrir el
  # mismo storage y Mem0 se rompe justo cuando hay actividad real. Qdrant
  # server si soporta multiples procesos concurrentes (lo sugiere el
  # propio error de Qdrant). Gratis, local, open source — mismo criterio
  # que LiveKit self-hosted.
  qdrant:
    image: qdrant/qdrant:latest
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  voice-agent:
    build:
      context: ./agent-starter-python
      dockerfile: Dockerfile
    depends_on:
      knowledge-sync:
        condition: service_started
      livekit:
        condition: service_started
      qdrant:
        condition: service_started
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL_INTERNAL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - GEMINI_LIVE_MODEL=${GEMINI_LIVE_MODEL:-gemini-3.8-live}
      - OLLAMA_BASE_URL=${OLLAMA_BASE_URL:-http://ollama:11434/v1}
      - KOKORO_BASE_URL=http://kokoro-tts:8880/v1
      - WHISPER_BASE_URL=http://whisper-stt:8000/v1
      - WHISPER_MODEL=${WHISPER_MODEL:-base}
      - OLLAMA_MODEL=${OLLAMA_MODEL:-nexus}
      - UV_CACHE_DIR=/tmp/uv-cache
      - KNOWLEDGE_DB=/data/knowledge.db
      - NEXUS_DOCS_DIR=/app/data/especializacion_ia
      - NEXUS_STORAGE_DIR=/app/data/nexus_storage
      - UAM_DOCS_DIR=/app/data/documentos_uam
      - UAM_STORAGE_DIR=/app/data/uam_storage
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
    volumes:
      - ./agent-starter-python/src:/app/src
      - ./agent-starter-python/tests:/app/tests
      - ./data/especializacion_ia:/app/data/especializacion_ia:ro
      - ./data/documentos_uam:/app/data/documentos_uam:ro
      - ./data/nexus_storage:/app/data/nexus_storage
      - ./data/uam_storage:/app/data/uam_storage
      - knowledge_data:/data:ro
    restart: unless-stopped

  # Puente VVA1: le entrega a Unreal (avatar NEXO) el audio del agente que esté hablando.
  # Solo trabaja mientras Unreal esté conectado a ws://127.0.0.1:8766.
  avatar-bridge:
    build:
      context: ./avatar-bridge
      dockerfile: Dockerfile
    depends_on:
      livekit:
        condition: service_started
    environment:
      # Igual que voice-agent: dentro de la red de Docker se habla con el
      # LiveKit self-hosted por su nombre de servicio, no por localhost.
      - LIVEKIT_URL=${LIVEKIT_URL_INTERNAL:-ws://livekit:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
    ports:
      # Solo loopback: el receptor de Unreal rechaza cualquier otro host.
      - "127.0.0.1:8766:8766"
      # Stream MJPEG de avatar-render (ver mas abajo: comparte esta red).
      # El frontend lo alcanza por dentro de la red de Docker
      # (avatar-bridge:8080), esto es solo para poder probarlo a mano desde
      # el host.
      - "127.0.0.1:${AVATAR_STREAM_PORT:-8080}:8080"
    restart: unless-stopped

  # Hace correr el juego empaquetado de Unreal (avatar NEXO/Familia VIVA)
  # headless contra una pantalla virtual, y manda lo que se ve por MJPEG.
  # Reemplaza el intento anterior con Pixel Streaming, que nunca llego a
  # verse en el navegador. Ver avatar-render/README.md para el detalle
  # completo (incluye por que comparte red con avatar-bridge en vez de
  # tener la suya) y como generar AVATAR_PACKAGE_DIR.
  #
  # Si AVATAR_PACKAGE_DIR no existe todavia (nadie genero el paquete, ver
  # el README) o la maquina no tiene GPU NVIDIA, este servicio entra en
  # crash-loop (restart: unless-stopped) sin tumbar el resto del stack:
  # nada mas depende de el. "docker compose ps" lo mostrara reiniciando
  # seguido; es esperado hasta que se genere el paquete.
  avatar-render:
    build:
      context: ./avatar-render
      dockerfile: Dockerfile
    # Comparte el loopback de avatar-bridge: VivaAvatarReceiver (C++, en el
    # juego) solo acepta BridgeURL=ws://127.0.0.1:*, por diseno (rechaza
    # cualquier host remoto). Sin esto, "127.0.0.1" adentro del contenedor
    # no seria avatar-bridge y la conexion nunca se establece.
    network_mode: "service:avatar-bridge"
    depends_on:
      avatar-bridge:
        condition: service_started
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - NVIDIA_DRIVER_CAPABILITIES=all
      # MJPEG no comprime entre frames (cada uno es un JPEG independiente): a
      # 1280x720/q6/15fps probado en vivo salian ~1.2 MB/s sostenidos, pesado
      # para un recuadro de avatar de fondo. 480p/q10/12fps baja bastante
      # eso a costa de nitidez; subir si el ancho de banda no es problema.
      - RENDER_WIDTH=${AVATAR_RENDER_WIDTH:-854}
      - RENDER_HEIGHT=${AVATAR_RENDER_HEIGHT:-480}
      - STREAM_FRAMERATE=${AVATAR_STREAM_FRAMERATE:-12}
      - STREAM_QUALITY=${AVATAR_STREAM_QUALITY:-10}
      - STREAM_PORT=8080
    # Debe ser el dueno real (en el host) de AVATAR_PACKAGE_DIR: el juego
    # escribe logs/config ahi en runtime, y ademas se niega a correr como
    # root. Default 1000:1000 (el usuario habitual en una sola maquina).
    user: "${AVATAR_UID:-1000}:${AVATAR_GID:-1000}"
    volumes:
      # Paquete de Unreal generado a mano (~2GB, no vive en git). Ver
      # avatar-render/README.md para como regenerarlo. NO usar :ro: el
      # Avatar1.sh que genera UE hace `chmod +x` al propio binario en cada
      # arranque (aunque ya sea ejecutable, el chmod en si falla sobre un
      # bind mount de solo lectura -- confirmado en vivo el 2026-10-09).
      - ${AVATAR_PACKAGE_DIR:-../Avatar-Package/Linux}:/avatar
    restart: unless-stopped

  frontend:
    build:
      context: ./agent-starter-react
      dockerfile: Dockerfile
    depends_on:
      - livekit
    ports:
      - "${FRONTEND_PORT:-3500}:3000"
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL:-ws://localhost:7880}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY:-devkey}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET:-secret}
      - AGENT_NAME=${AGENT_NAME:-nexus}
      # avatar-render comparte red con avatar-bridge (ver avatar-render/README.md), por
      # eso el MJPEG se alcanza como avatar-bridge:8080, no avatar-render:8080.
      - AVATAR_STREAM_SOURCE_URL=${AVATAR_STREAM_SOURCE_URL:-http://avatar-bridge:8080/stream}
      - AVATAR_BRIDGE_STATUS_URL=${AVATAR_BRIDGE_STATUS_URL:-http://avatar-bridge:8766/status}
      - AVATAR_BRIDGE_HINT_URL=${AVATAR_BRIDGE_HINT_URL:-http://avatar-bridge:8766/hint}
      - AVATAR_MUTE_AGENT_AUDIO=${AVATAR_MUTE_AGENT_AUDIO:-true}
      - ALLOW_INSECURE_ROOM_CREATION=true
      - IS_VERCEL_PREVIEW=true
    restart: unless-stopped

# Los volúmenes se crean solos en el primer `docker compose up` y se reutilizan después.
volumes:
  ollama_data:
    name: azimutai_ollama_data
  kokoro_cache:
    name: azimutai_kokoro_cache
  whisper_cache:
    name: azimutai_whisper_cache
  knowledge_data:
    name: azimutai_knowledge_data
  qdrant_data:
    name: azimutai_qdrant_data

