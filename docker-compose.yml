services:
  ollama:
    image: ollama/ollama:latest
    ports:
      - "${OLLAMA_PORT:-11435}:11434"
    volumes:
      - ollama_data:/root/.ollama
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - OLLAMA_KEEP_ALIVE=-1
    healthcheck:
      test: ["CMD-SHELL", "ollama list || exit 1"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 5s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    depends_on:
      ollama:
        condition: service_healthy
    environment:
      - OLLAMA_HOST=http://ollama:11434
    volumes:
      - ./agent-starter-python/Modelfile:/Modelfile:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Verificando disponibilidad de Ollama..."
        until ollama list > /dev/null 2>&1; do sleep 1; done
        if ! ollama list | grep -q "nexus"; then
          echo "Descargando modelo base llama3.2:3b..."
          ollama pull llama3.2:3b
          echo "Creando modelo personalizado nexus (4096 tokens de contexto)..."
          ollama create nexus -f /Modelfile
          echo "Modelo nexus listo para su uso."
        else
          echo "Modelo nexus ya disponible en el volumen persistente."
        fi
        echo "Precargando modelo nexus en memoria..."
        ollama run nexus "hola" > /dev/null 2>&1
        echo "Nexus activo en memoria y listo para llamadas."
    restart: "no"

  kokoro-tts:
    image: ghcr.io/remsky/kokoro-fastapi-gpu:latest
    ports:
      - "8880:8880"
    volumes:
      - kokoro_cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: unless-stopped

  whisper-stt:
    build:
      context: ./whisper-service
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - whisper_cache:/models_cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - DEVICE=cuda
      - COMPUTE_TYPE=float16
      - HF_HOME=/models_cache
    restart: unless-stopped

  voice-agent:
    build:
      context: ./agent-starter-python
      dockerfile: Dockerfile
    depends_on:
      ollama-init:
        condition: service_completed_successfully
      kokoro-tts:
        condition: service_started
      whisper-stt:
        condition: service_started
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - OLLAMA_BASE_URL=http://ollama:11434/v1
      - KOKORO_BASE_URL=http://kokoro-tts:8880/v1
      - WHISPER_BASE_URL=http://whisper-stt:8000/v1
      - WHISPER_MODEL=${WHISPER_MODEL:-large-v3-turbo}
      - UV_CACHE_DIR=/tmp/uv-cache
    restart: unless-stopped

  frontend:
    build:
      context: ./agent-starter-react
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - LIVEKIT_URL=${LIVEKIT_URL}
      - LIVEKIT_API_KEY=${LIVEKIT_API_KEY}
      - LIVEKIT_API_SECRET=${LIVEKIT_API_SECRET}
      - AGENT_NAME=${AGENT_NAME:-nexus}
      - ALLOW_INSECURE_ROOM_CREATION=true
      - IS_VERCEL_PREVIEW=true
    restart: unless-stopped

volumes:
  ollama_data:
    external: true
    name: azimutai_ollama_data
  kokoro_cache:
    external: true
    name: azimutai_kokoro_cache
  whisper_cache:
    name: azimutai_whisper_cache

